<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>푸드트럭하우스 · 견적 상담</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --accent:#E8553B;        /* 포인트색 (딱 하나) */
    --accent-press:#D2432A;
    --ink:#191F28;           /* 진한 글자 */
    --sub:#8B95A1;           /* 보조 회색 글자 */
    --line:#EDF0F3;          /* 얇은 구분선 */
    --bot:#F2F4F6;           /* 봇 말풍선 회색 */
    --page:#F7F8FA;          /* 데스크탑 바깥 배경 */
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--page);
    font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink);display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 앱 셸 ─────────────────────────────── */
  .app{
    width:100%;max-width:460px;height:100dvh;background:var(--white);
    display:flex;flex-direction:column;position:relative;
  }

  /* ── 헤더 ─────────────────────────────── */
  .head{
    flex:0 0 auto;display:flex;align-items:center;gap:11px;
    padding:14px 18px;background:var(--white);
    border-bottom:1px solid var(--line);z-index:3;
  }
  .head .logo{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    font-size:19px;
  }
  .head .meta{flex:1;min-width:0;line-height:1.3}
  .head .title{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
  .head .status{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub);margin-top:1px}
  .head .dot{width:6px;height:6px;border-radius:50%;background:#22C55E}
  .head .kakao-btn{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
    background:#FEE500;color:#3C1E1E;text-decoration:none;
    font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:999px;
    letter-spacing:-.2px;transition:.12s;white-space:nowrap;
  }
  .head .kakao-btn:hover{filter:brightness(.96)}
  .head .kakao-btn:active{transform:scale(.96)}

  /* ── 대화 영역 ─────────────────────────── */
  .stream{
    flex:1 1 auto;overflow-y:auto;padding:20px 18px 10px;
    display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;
  }
  .stream::-webkit-scrollbar{width:0}

  .row{display:flex;max-width:100%}
  .row.me{justify-content:flex-end}

  .bubble{
    max-width:80%;padding:11px 14px;font-size:14.5px;line-height:1.6;
    border-radius:18px;word-break:break-word;white-space:pre-wrap;letter-spacing:-.2px;
    animation:rise .26s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .bot .bubble{
    background:var(--bot);color:var(--ink);
    border-top-left-radius:6px;
  }
  .me  .bubble{
    background:var(--accent);color:#fff;
    border-top-right-radius:6px;
  }

  /* 타이핑 표시 */
  .typing{display:inline-flex;gap:5px;align-items:center;padding:3px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#B0B8C1;animation:blink 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* ── 빠른 답변 칩 ──────────────────────── */
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 18px 14px}
  .chip{
    border:1px solid #E1E5EA;background:var(--white);color:#4E5968;
    border-radius:999px;padding:9px 15px;font-family:inherit;font-size:13.5px;
    font-weight:500;cursor:pointer;transition:.12s;letter-spacing:-.2px;
  }
  .chip:hover{background:#F7F8FA;border-color:#D5DAE0}
  .chip:active{transform:scale(.97)}

  /* ── 입력 바 ───────────────────────────── */
  .composer{
    flex:0 0 auto;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--white);border-top:1px solid var(--line);
    display:flex;align-items:flex-end;gap:9px;
  }
  .composer .field{
    flex:1;display:flex;align-items:flex-end;background:#F2F4F6;
    border-radius:22px;padding:4px 6px 4px 16px;
  }
  .composer textarea{
    flex:1;resize:none;border:none;background:transparent;
    padding:8px 0;font-family:inherit;font-size:14.5px;color:var(--ink);
    line-height:1.45;max-height:110px;outline:none;letter-spacing:-.2px;
  }
  .composer textarea::placeholder{color:#AEB5BD}
  .send{
    flex:0 0 auto;width:40px;height:40px;border:none;border-radius:50%;
    background:var(--accent);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.12s;
  }
  .send svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .send:hover:not(:disabled){background:var(--accent-press)}
  .send:active:not(:disabled){transform:scale(.94)}
  .send:disabled{background:#D5DAE0;cursor:not-allowed}

  .err{color:var(--accent-press);font-size:12.5px;text-align:center;padding:2px 18px 6px}
</style>
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="logo">🚚</div>
      <div class="meta">
        <div class="title">푸드트럭하우스</div>
        <div class="status"><span class="dot"></span>견적 상담 · 지금 응대 가능</div>
      </div>
      <a class="kakao-btn" href="https://pf.kakao.com/_MJvVG/chat" target="_blank" rel="noopener" aria-label="카카오톡 상담">💬 카톡상담</a>
    </header>

    <main class="stream" id="stream" aria-live="polite"></main>

    <div class="chips" id="chips"></div>

    <footer class="composer">
      <div class="field">
        <textarea id="input" rows="1" placeholder="메시지를 입력하세요"></textarea>
      </div>
      <button class="send" id="send" aria-label="보내기">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </footer>
  </div>

<script>
(function(){
  const streamEl = document.getElementById('stream');
  const chipsEl  = document.getElementById('chips');
  const inputEl  = document.getElementById('input');
  const sendEl   = document.getElementById('send');

  // 대화 히스토리 (API에 매번 전체를 함께 보낸다 — AI는 이전 대화를 기억하지 못하므로)
  const history = [];
  let busy = false;

  const GREETING = '안녕하세요! 푸드트럭하우스 견적 도우미예요 🚚\n행사에 필요하신 메뉴나 인원, 지역을 알려주시면 정확한 견적을 안내해 드릴게요.';
  const QUICK = ['견적 받아보고 싶어요', '메뉴가 궁금해요', '최소 주문 금액이 있나요?', '출장 가능 지역은?'];

  function addBubble(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'me' : 'bot');
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    streamEl.appendChild(row);
    scrollDown();
    return row;
  }

  function showTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typing-row';
    row.innerHTML = '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    streamEl.appendChild(row);
    scrollDown();
  }
  function hideTyping(){ const t = document.getElementById('typing-row'); if (t) t.remove(); }
  function scrollDown(){ streamEl.scrollTop = streamEl.scrollHeight; }

  function renderChips(list){
    chipsEl.innerHTML = '';
    (list || []).forEach(function(txt){
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = txt;
      b.onclick = function(){ if (!busy) send(txt); };
      chipsEl.appendChild(b);
    });
  }

  function showError(msg){
    const p = document.createElement('div');
    p.className = 'err';
    p.textContent = msg;
    streamEl.appendChild(p);
    scrollDown();
  }

  async function send(text){
    text = (text != null ? text : inputEl.value).trim();
    if (!text || busy) return;

    busy = true;
    sendEl.disabled = true;
    inputEl.value = '';
    autoGrow();
    renderChips([]);

    addBubble('user', text);
    history.push({ role: 'user', content: text });

    showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      hideTyping();

      if (!res.ok || data.error) {
        showError('⚠️ ' + (data.error || '일시적인 오류가 발생했어요. 잠시 후 다시 시도해 주세요.'));
      } else {
        const reply = data.reply || '죄송해요, 다시 한 번 말씀해 주시겠어요?';
        addBubble('assistant', reply);
        history.push({ role: 'assistant', content: reply });
      }
    } catch (e) {
      hideTyping();
      showError('⚠️ 연결에 실패했어요. 네트워크를 확인해 주세요.');
    } finally {
      busy = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  }

  function autoGrow(){
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
  }

  sendEl.addEventListener('click', function(){ send(); });
  inputEl.addEventListener('input', autoGrow);
  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  addBubble('assistant', GREETING);
  renderChips(QUICK);
  inputEl.focus();
})();
</script>
</body>
</html>
