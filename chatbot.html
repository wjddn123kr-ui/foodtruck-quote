<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>푸드트럭하우스 · 견적 상담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF4EA; --card:#FFFFFF; --ink:#2C2622; --muted:#9C8E82;
    --tomato:#E8553B; --tomato-deep:#C8412B; --amber:#F2B544; --amber-soft:#FCEBC9;
    --line:#EFE2D2; --ok:#3F9D6B; --field:#FBF4EA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);
    font-family:'Gowun Dodum',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);display:flex;justify-content:center;
  }

  /* ── 앱 셸 ────────────────────────────────── */
  .app{
    width:100%;max-width:480px;height:100dvh;background:var(--card);
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 18px 54px rgba(200,65,43,.14);
  }

  /* ── 헤더 ─────────────────────────────────── */
  .head{
    background:linear-gradient(135deg,var(--tomato),var(--tomato-deep));
    color:#fff;padding:16px 20px;display:flex;align-items:center;gap:13px;
    flex:0 0 auto;box-shadow:0 6px 18px rgba(200,65,43,.22);z-index:3;
  }
  .head .logo{
    width:46px;height:46px;border-radius:14px;background:var(--amber);
    display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:0 4px 10px rgba(0,0,0,.14);flex:0 0 auto;
  }
  .head .meta{flex:1;min-width:0}
  .head .title{font-family:'Jua',sans-serif;font-size:18px;line-height:1.2;letter-spacing:.2px}
  .head .status{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.92;margin-top:3px}
  .head .dot{width:8px;height:8px;border-radius:50%;background:#8BF0AF;box-shadow:0 0 0 0 rgba(139,240,175,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,240,175,.7)}70%{box-shadow:0 0 0 7px rgba(139,240,175,0)}100%{box-shadow:0 0 0 0 rgba(139,240,175,0)}}

  /* ── 대화 영역 ────────────────────────────── */
  .stream{
    flex:1 1 auto;overflow-y:auto;padding:20px 16px 8px;
    display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
    background:
      radial-gradient(120% 60% at 50% 0%, #fff 0%, var(--card) 60%);
  }
  .stream::-webkit-scrollbar{width:6px}
  .stream::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

  .row{display:flex;gap:9px;align-items:flex-end;max-width:100%}
  .row.me{justify-content:flex-end}
  .av{
    width:32px;height:32px;border-radius:50%;flex:0 0 auto;
    background:var(--amber-soft);display:flex;align-items:center;justify-content:center;
    font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.06);
  }

  .bubble{
    max-width:78%;padding:11px 14px;font-size:14.5px;line-height:1.55;
    border-radius:18px;position:relative;word-break:break-word;white-space:pre-wrap;
    animation:pop .28s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

  .bot .bubble{
    background:var(--field);color:var(--ink);
    border:1px solid var(--line);border-bottom-left-radius:6px;
  }
  .me  .bubble{
    background:linear-gradient(135deg,var(--tomato),var(--tomato-deep));
    color:#fff;border-bottom-right-radius:6px;
    box-shadow:0 6px 16px rgba(200,65,43,.24);
  }

  /* 타이핑 인디케이터 */
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}
  .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ── 빠른 답변 칩 ─────────────────────────── */
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 12px}
  .chip{
    border:1.5px solid var(--amber);background:#fff;color:var(--tomato-deep);
    border-radius:999px;padding:8px 14px;font-family:inherit;font-size:13px;
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .chip:hover{background:var(--amber-soft)}
  .chip:active{transform:scale(.96)}

  /* ── 입력 바 ──────────────────────────────── */
  .composer{
    flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--card);border-top:1px solid var(--line);
    display:flex;align-items:flex-end;gap:9px;
  }
  .composer textarea{
    flex:1;resize:none;border:1.5px solid var(--line);background:var(--field);
    border-radius:16px;padding:11px 14px;font-family:inherit;font-size:14.5px;
    color:var(--ink);line-height:1.4;max-height:120px;outline:none;transition:.15s;
  }
  .composer textarea:focus{border-color:var(--tomato);background:#fff}
  .composer textarea::placeholder{color:var(--muted)}
  .send{
    flex:0 0 auto;width:46px;height:46px;border:none;border-radius:15px;
    background:var(--tomato);color:#fff;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.15s;
    box-shadow:0 6px 14px rgba(200,65,43,.28);
  }
  .send:hover:not(:disabled){background:var(--tomato-deep);transform:translateY(-1px)}
  .send:disabled{background:var(--muted);box-shadow:none;cursor:not-allowed;opacity:.6}

  .err{color:var(--tomato-deep);font-size:12.5px;text-align:center;padding:0 16px 8px}
</style>
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="logo">🚚</div>
      <div class="meta">
        <div class="title">푸드트럭하우스</div>
        <div class="status"><span class="dot"></span>견적 상담 도우미 · 지금 응대 가능</div>
      </div>
    </header>

    <main class="stream" id="stream" aria-live="polite"></main>

    <div class="chips" id="chips"></div>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="메뉴, 인원, 지역 등을 편하게 말씀해 주세요…"></textarea>
      <button class="send" id="send" aria-label="보내기">➤</button>
    </footer>
  </div>

<script>
(function(){
  const streamEl = document.getElementById('stream');
  const chipsEl  = document.getElementById('chips');
  const inputEl  = document.getElementById('input');
  const sendEl   = document.getElementById('send');

  // 대화 히스토리 (API에 매번 전체를 함께 보낸다 — AI는 이전 대화를 기억하지 못하므로)
  const history = [];
  let busy = false;

  const GREETING = '안녕하세요! 푸드트럭하우스 견적 도우미예요 🚚\n행사에 필요하신 메뉴나 인원, 지역을 알려주시면 정확한 견적을 안내해 드릴게요.';
  const QUICK = ['견적 받아보고 싶어요', '메뉴가 궁금해요', '최소 주문 금액이 있나요?', '출장 가능 지역은?'];

  // ── 말풍선 추가 ────────────────────────────
  function addBubble(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'me' : 'bot');
    const av = role === 'user' ? '' : '<div class="av">🤖</div>';
    const meAv = role === 'user' ? '<div class="av" style="background:#FCE4DC">🙂</div>' : '';
    row.innerHTML =
      (role === 'user' ? '' : av) +
      '<div class="bubble"></div>' +
      (role === 'user' ? meAv : '');
    row.querySelector('.bubble').textContent = text;
    streamEl.appendChild(row);
    scrollDown();
    return row;
  }

  // ── 타이핑 표시 ────────────────────────────
  function showTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typing-row';
    row.innerHTML = '<div class="av">🤖</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    streamEl.appendChild(row);
    scrollDown();
  }
  function hideTyping(){
    const t = document.getElementById('typing-row');
    if (t) t.remove();
  }

  function scrollDown(){ streamEl.scrollTop = streamEl.scrollHeight; }

  // ── 빠른 답변 칩 ───────────────────────────
  function renderChips(list){
    chipsEl.innerHTML = '';
    (list || []).forEach(function(txt){
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = txt;
      b.onclick = function(){ if (!busy) send(txt); };
      chipsEl.appendChild(b);
    });
  }

  function showError(msg){
    const p = document.createElement('div');
    p.className = 'err';
    p.textContent = msg;
    streamEl.appendChild(p);
    scrollDown();
  }

  // ── 전송 ───────────────────────────────────
  async function send(text){
    text = (text != null ? text : inputEl.value).trim();
    if (!text || busy) return;

    busy = true;
    sendEl.disabled = true;
    inputEl.value = '';
    autoGrow();
    renderChips([]);          // 첫 입력 후 칩 숨김

    addBubble('user', text);
    history.push({ role: 'user', content: text });

    showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      hideTyping();

      if (!res.ok || data.error) {
        showError('⚠️ ' + (data.error || '일시적인 오류가 발생했어요. 잠시 후 다시 시도해 주세요.'));
      } else {
        const reply = data.reply || '죄송해요, 다시 한 번 말씀해 주시겠어요?';
        addBubble('assistant', reply);
        history.push({ role: 'assistant', content: reply });
      }
    } catch (e) {
      hideTyping();
      showError('⚠️ 연결에 실패했어요. 네트워크를 확인해 주세요.');
    } finally {
      busy = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  }

  // ── 입력창 자동 높이 ───────────────────────
  function autoGrow(){
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  // ── 이벤트 ─────────────────────────────────
  sendEl.addEventListener('click', function(){ send(); });
  inputEl.addEventListener('input', autoGrow);
  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  // ── 시작 ───────────────────────────────────
  addBubble('assistant', GREETING);
  renderChips(QUICK);
  inputEl.focus();
})();
</script>
</body>
</html>
